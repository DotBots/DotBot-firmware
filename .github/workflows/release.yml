name: Release

on:
  push:
    tags: '*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Release everything `dotbot fw artifacts` (bare .hex) and
        # `dotbot fw artifacts --sandbox` (sandbox .bin) can build, so one tag
        # carries every image the testbed flows fetch: bare dotbot + nrf5340_net
        # netcore, lh2_calibration, the sandbox apps, and the gateways. Bare
        # targets mirror build.yml, sandbox targets build-sandbox.yml - both
        # CI-proven via the same `make docker`. Output format per target is
        # driven by the Makefile (ARTIFACT_FMT: bare -> .hex, sandbox -> .bin).
        target:
          - dotbot-v2
          - dotbot-v3
          - nrf52840dk
          - nrf5340dk-app
          - nrf5340dk-net
          - sandbox-dotbot-v2
          - sandbox-dotbot-v3
          - sandbox-nrf5340dk
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Build release artifacts
        run: BUILD_TARGET=${{ matrix.target }} BUILD_CONFIG=Release DOCKER_TARGETS="artifacts" make docker
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: artifacts/*

  release:
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: ./artifacts
          merge-multiple: true
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          artifacts: "artifacts/*"
          token: ${{ secrets.RELEASE_TOKEN }}
