name: CI

on:
  push:
    branches:
      - main
  # No path filter on the trigger: style, build-success and doc are required
  # checks, so they must report on every PR. The `changes` job below decides
  # whether the bare build runs.
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bare: ${{ steps.filter.outputs.bare }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      # Sandbox-only changes are covered by build-sandbox.yml; skip the bare
      # build for them. Shared infra (Makefile, dotbot-libs, ...) still runs both.
      - name: Detect changes outside the sandbox
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          predicate-quantifier: 'every'
          filters: |
            bare:
              - '!apps-sandbox/**'
              - '!sandbox-*.emProject'

  build:
    needs: changes
    if: needs.changes.outputs.bare == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["dotbot-v1", "dotbot-v2", "dotbot-v3", "freebot-v1.0", "lh2-mini-mote", "nrf52833dk", "nrf52840dk", "nrf5340dk-app", "nrf5340dk-net", "sailbot-v1", "xgo-v1", "xgo-v2"]
        config: ["Debug", "Release"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Deprecation notice
        if: contains(fromJSON('["dotbot-v1", "freebot-v1.0", "lh2-mini-mote"]'), matrix.target)
        run: echo "::warning title=Planned deprecation::Board target '${{ matrix.target }}' is planned for deprecation around November 2026."
      - name: Build apps
        run: BUILD_TARGET=${{ matrix.target }} BUILD_CONFIG=${{ matrix.config }} make docker

  build-success:
    # Passes when every build succeeded, or when `changes` found nothing
    # outside the sandbox and the build was skipped for that reason.
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: build succeeded
      env:
        CHANGES: ${{ needs.changes.result }}
        BARE: ${{ needs.changes.outputs.bare }}
        BUILD: ${{ needs.build.result }}
      run: |
        echo "changes=$CHANGES bare=$BARE build=$BUILD"
        if [ "$CHANGES" != "success" ]; then exit 1; fi
        if [ "$BARE" = "true" ] && [ "$BUILD" = "success" ]; then exit 0; fi
        if [ "$BARE" = "false" ] && [ "$BUILD" = "skipped" ]; then exit 0; fi
        exit 1

  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Check style
        run: make check-format

  doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install Sphinx
        run: python -m pip install -r doc/sphinx/requirements.txt
      - name: Build documentation
        run: make doc

  # Disable Docker build for now because SEGGER requires authentication
  # to download SEGGER Embedded Studio
  # docker:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repo
  #       uses: actions/checkout@v4
  #     - name: Build docker image
  #       run: docker build -t dotbot .
